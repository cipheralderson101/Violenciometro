<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header class="encabezado">
        <div class="logo-contenedor">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
            <div class="texto-encabezado">
                <h1>Secretaría de Educación, Ciencia, Tecnología e Innovación</h1>
            </div>
        </div>

        <div class="linea-vino"></div>
        <div class="gobierno-texto">Gobierno del Estado de México</div>
    </header>

    <main>
        <div class="contenedor-formulario">
            <h2>Iniciar Sesión</h2>

            <!-- ✅ Ahora coincide perfectamente con app.py -->
            <form action="/login" method="POST">

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="Ingrese su correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña" required>

                <button type="submit" class="btn">Ingresar</button>
            </form>

            <div class="enlace">
                <a href="/registrarse">¿No tienes cuenta? Regístrate aquí</a>
            </div>

        </div>
    </main>

    <footer>
        © 2025 Secretaría de Educación. Todos los derechos reservados.
    </footer>
</body>
</html>
