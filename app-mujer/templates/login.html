<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - App Mujer Segura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
<header class="encabezado">
    <div class="logo-texto">
        <img src="{{ url_for('static', filename='logo.png') }}" class="logo">
        <h1 class="titulo-principal">Secretaría de Educación, Ciencia, Tecnología e Innovación</h1>
    </div>
    <div class="linea-vino"></div>
    <div class="gobierno-texto">Gobierno del Estado de México</div>
</header>

<div class="contenedor-formulario">
    <h2>Inicio de Sesión</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <input type="password" name="contrasena" placeholder="Contraseña" required>
        <button type="submit" class="btn">Ingresar</button>
    </form>

    <p>¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a></p>
</div>
</body>
</html>
