<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - App Mujer Segura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
<header class="encabezado">
    <div class="logo-texto">
        <img src="{{ url_for('static', filename='logo.png') }}" class="logo">
        <h1 class="titulo-principal">Secretaría de Educación, Ciencia, Tecnología e Innovación</h1>
    </div>
    <div class="linea-vino"></div>
    <div class="gobierno-texto">Gobierno del Estado de México</div>
</header>

<div class="contenedor-formulario">
    <h2>Registro de Usuaria</h2>
    <form method="POST">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="text" name="apellido" placeholder="Apellido" required>
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <input type="password" name="contrasena" placeholder="Contraseña" required>
        <button type="submit" class="btn">Registrar</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a></p>
</div>
</body>
</html>
