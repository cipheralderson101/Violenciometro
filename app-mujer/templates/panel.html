<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<div class="encabezado">
    <div class="logo-contenedor">
        <img src="{{ url_for('static', filename='logo.png') }}" class="logo">
        <h1 class="titulo-principal">Bienvenida {{ nombre }}</h1>
    </div>
    <div class="linea-vino"></div>
    <div class="gobierno-texto">Gobierno del Estado de México</div>
</div>

<div class="contenedor-formulario centrado">
    <h2>Menú principal</h2>

    <div class="menu-botones">
        <a class="btn" href="/test">Realizar Test</a>
        <a class="btn" href="/historial">Ver Historial</a>
        <a class="btn" href="/alerta">Enviar Alerta</a>
        <a class="btn-rojo" href="/logout">Cerrar sesión</a>
    </div>

</div>

</body>
</html>
