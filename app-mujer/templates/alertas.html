<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas - App Mujer Segura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        .contenedor { max-width:700px; margin:20px auto; padding:20px; background:#f9f9f9; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
        h2, h3 { text-align:center; color:#7a0010; margin-bottom:15px; }
        .centrado { text-align:center; }
        label { font-weight:bold; display:block; margin-bottom:5px; }
        textarea, input[type="file"] { width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc; }
        #mapa { height:300px; width:100%; border-radius:10px; margin:15px 0; }
        .btn-blanco { background-color: white; color: #7a0010; border: 2px solid #7a0010; padding:12px 20px; border-radius:5px; font-weight:bold; cursor:pointer; margin-top:10px; }
        .btn-blanco:hover { background-color:#f5f5f5; }
    </style>
</head>
<body>

<header class="encabezado">
    <div class="logo-contenedor">
        <img src="{{ url_for('static', filename='logo.png') }}" class="logo" alt="Logo">
        <h1 class="titulo-principal">Secretaría de Educación, Ciencia, Tecnología e Innovación</h1>
    </div>
    <div class="linea-vino"></div>
    <div class="gobierno-texto">Gobierno del Estado de México</div>
</header>

<div class="contenedor">
    <h2>Alertas de Emergencia</h2>
    <p class="centrado" style="color:#cc0000; font-weight:bold;">
        Si estás en peligro, presiona el botón de alerta.
    </p>

    <form id="alertaForm" method="POST" action="/alertas" enctype="multipart/form-data">
        <input type="hidden" id="latitud" name="latitud">
        <input type="hidden" id="longitud" name="longitud">

        <label for="descripcion">Describe la situación:</label>
        <textarea id="descripcion" name="descripcion" placeholder="Escribe lo que está pasando..." required></textarea>

        <label for="archivo">Adjuntar evidencia (foto o video):</label>
        <input type="file" id="archivo" name="archivo" accept="image/*,video/*">

        <div class="centrado">
            <button type="button" class="btn-blanco" onclick="enviarAlerta()">Enviar Alerta</button>
            <a href="{{ url_for('menu') }}" class="btn-blanco">Volver al Menú</a>
        </div>
    </form>

    <h3>Mapa de tu ubicación actual</h3>
    <div id="mapa"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map, marcador;

// Inicializamos mapa en México como fallback
function initMap(lat=19.4326, lng=-99.1332) {
    map = L.map('mapa').setView([lat, lng], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    marcador = L.marker([lat, lng]).addTo(map)
        .bindPopup("Tu ubicación actual")
        .openPopup();

    document.getElementById('latitud').value = lat;
    document.getElementById('longitud').value = lng;
}

// Pedimos ubicación real al cargar la página
window.onload = function() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            initMap(lat, lng);
        }, function(error) {
            alert("No se pudo obtener tu ubicación. Se usará ubicación predeterminada.");
            initMap();
        }, { enableHighAccuracy: true });
    } else {
        alert("Tu navegador no soporta geolocalización.");
        initMap();
    }
};

// Enviar alerta con ubicación actual
function enviarAlerta() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            document.getElementById('latitud').value = lat;
            document.getElementById('longitud').value = lng;

            if (marcador) marcador.setLatLng([lat, lng]);
            map.setView([lat, lng], 14);

            document.getElementById('alertaForm').submit();
        }, function() {
            alert("No se pudo obtener tu ubicación para enviar la alerta.");
        }, { enableHighAccuracy: true });
    } else {
        alert("Tu navegador no soporta geolocalización.");
    }
}
</script>

</body>
</html>
