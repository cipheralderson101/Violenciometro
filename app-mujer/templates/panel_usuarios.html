<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <h1>Panel de la Usuaria</h1>
</header>
<div class="container">
    <h2>Bienvenida usuaria #{{ id }}</h2>

    <button onclick="mostrarFormulario('test')">Registrar Test</button>
    <button onclick="mostrarFormulario('historial')">Registrar Historial</button>
    <button onclick="mostrarFormulario('alerta')">Enviar Alerta</button>

    <div id="form-test" class="formulario oculto">
        <h3>Registrar Test</h3>
        <form action="/insertar_test" method="POST">
            <input type="hidden" name="usuario_id" value="{{ id }}">
            <input type="email" name="correo" placeholder="Correo">
            <input type="number" name="puntaje" placeholder="Puntaje">
            <button type="submit">Guardar</button>
        </form>
    </div>

    <div id="form-historial" class="formulario oculto">
        <h3>Historial</h3>
        <form action="/insertar_historial" method="POST">
            <input type="hidden" name="usuario_id" value="{{ id }}">
            <textarea name="descripcion" placeholder="Escribe la descripción"></textarea>
            <button type="submit">Guardar</button>
        </form>
    </div>

    <div id="form-alerta" class="formulario oculto">
        <h3>Enviar Alerta</h3>
        <form action="/insertar_alerta" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="usuario_id" value="{{ id }}">
            <input type="email" name="correo" placeholder="Correo">
            <input type="text" name="latitud" placeholder="Latitud">
            <input type="text" name="longitud" placeholder="Longitud">
            <input type="file" name="archivo">
            <input type="text" name="tipo" placeholder="Tipo de evidencia">
            <textarea name="descripcion" placeholder="Descripción"></textarea>
            <button type="submit">Enviar</button>
        </form>
    </div>
</div>

<script>
function mostrarFormulario(tipo) {
    document.querySelectorAll('.formulario').forEach(f => f.classList.add('oculto'));
    document.getElementById('form-' + tipo).classList.remove('oculto');
}
</script>
</body>
</html>
